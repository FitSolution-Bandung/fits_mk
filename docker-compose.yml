name: fits-mk
services:
  db:
    image: postgres:16
    container_name: fits-mk-db
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - fits-mk-db-data:/var/lib/postgresql/data
    restart: unless-stopped
  odoo:
    image: odoo:19
    container_name: fits-mk-odoo
    depends_on: [db]
    ports:
      - "8029:8069"
      - "8030:8072"
    environment:
      HOST: db
      USER: ${POSTGRES_USER}
      PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./:/mnt/extra-addons:ro
      - ./config:/etc/odoo
      - fits-mk-odoo-data:/var/lib/odoo
    restart: unless-stopped
volumes:
  fits-mk-db-data:
  fits-mk-odoo-data:
